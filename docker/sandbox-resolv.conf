# Baked resolver config for the aios sandbox image.
#
# Docker masks this file with its own bind mount in any container it manages
# networking for, so a running sandbox never sees it. It exists for the two
# places that read the image's own /etc/resolv.conf:
#
#   * the netns-joining lockdown sidecar (``docker run --network container:X``),
#     for which Docker does NOT write a resolv.conf, and
#   * the runsc egress exec, which chroots into this image mounted read-only at
#     ``_RUNSC_OPERATOR_ROOT`` -- there ``getent`` MUST find a nameserver here,
#     because nothing can write to a read-only mount.
#
# The address is Docker's embedded DNS, served on the netns-local loopback of
# every user-defined network. Keep it equal to
# ``aios.sandbox.setup._EMBEDDED_DNS_ADDRESS``; a unit test pins the pair.
nameserver 127.0.0.11
