[project]
name = "aios-browser-driver"
version = "0.1.0"
description = "Chromium driver daemon for the aios per-account browser (jarbot#106 Phase 2)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "aios contributors" }]

# Deliberately NO aios dependency and NO workspace source: the browser image
# installs this package standalone, and browser_protocol.py is a vendored
# byte-identical copy (drift-guarded by tests/test_protocol_drift.py), not an
# import of ``aios``. The image COPYs the src/ original over the copy at build
# time so the runtime contract can never fork.
#
# playwright does NOT pin the image's Chromium (docker/Dockerfile.browser pins
# a Chrome for Testing build to meet a security floor playwright's bundled
# build can trail) — but keep this minor on the SAME Chromium milestone as
# that pin (1.64.x <-> 156) so playwright drives the CDP surface it targets.
dependencies = [
    "playwright>=1.64.1,<1.65",
    "pydantic>=2.9",
    "python-ulid>=3.0",
]

[project.scripts]
aios-browser-driver = "aios_browser_driver.daemon:main"
browser-cli = "aios_browser_driver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aios_browser_driver"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["aios_browser_driver", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "TID", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The browser lane (real Chromium via playwright) is opt-in: run it with
# `pytest -m browser`. Deselected by default so the unit lane needs no
# browsers installed.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not browser"]
markers = [
    "browser: exercises a real Chromium via playwright; run explicitly with -m browser",
]
