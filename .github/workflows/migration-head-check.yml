name: Migration head check

on:
  # No paths filter: once a branch contains a migration, every subsequent push
  # must re-evaluate it against master, which may have advanced independently.
  push:
  pull_request:
    paths:
      - migrations/**
      - scripts/check_migration_heads.py
      - tests/unit/test_check_migration_heads.py
      - .github/workflows/migration-head-check.yml

concurrency:
  group: migration-head-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pushed branch
        uses: actions/checkout@v4

      # Resolve master when the job starts rather than using the push/PR event's
      # base SHA: the invariant is branch ∪ live master, including migrations
      # merged after this branch's push event was created.
      - name: Check out live master
        uses: actions/checkout@v4
        with:
          ref: master
          path: _base

      - uses: astral-sh/setup-uv@v4

      - name: Detect branched Alembic history against live master
        run: >-
          uv run python scripts/check_migration_heads.py migrations/versions
          --base-versions-dir _base/migrations/versions

      - name: Mutation and parser self-tests
        run: uv run pytest tests/unit/test_check_migration_heads.py -q
