name: pipeline-provenance-rerun

# Companion to pipeline-provenance.yml. The canonical review record that makes `reviewed:green`
# valid for a head is a PR COMMENT, and comments do not fire pull_request_target. An
# issue_comment-triggered job cannot report the check itself (its check suite belongs to the
# default branch, not the PR head), so it RE-RUNS the latest pipeline-provenance run for the PR's
# live head; that run re-reads labels + thread live. Deletions/edits re-run too, so removing or
# vetoing a record can turn a green check red again.
#
# Only GitHub metadata is read; nothing is checked out and no comment text reaches a shell.

on:
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: pipeline-provenance-rerun-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  rerun-on-comment:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run pipeline-provenance for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_state=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.state + " " + .head.sha')
          read -r state head <<<"$pr_state"
          if [[ "$state" != "open" ]]; then echo "PR #${PR} is ${state}; nothing to re-run"; exit 0; fi
          runs="repos/${REPO}/actions/workflows/pipeline-provenance.yml/runs?event=pull_request_target&head_sha=${head}&per_page=1"
          # A run still in flight already reads the thread live at its fetch step, but it may have
          # fetched before this comment landed, so wait for it to finish and re-run it anyway.
          for _ in $(seq 1 60); do
            run=$(gh api "$runs" --jq '.workflow_runs[0] | select(.) | "\(.id) \(.status)"')
            if [[ -z "$run" ]]; then
              echo "::error::no pipeline-provenance run found for PR #${PR} head ${head}"
              exit 1
            fi
            read -r run_id status <<<"$run"
            if [[ "$status" == "completed" ]]; then
              gh api -X POST "repos/${REPO}/actions/runs/${run_id}/rerun"
              echo "re-ran pipeline-provenance run ${run_id} for PR #${PR} head ${head}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::pipeline-provenance run ${run_id} for PR #${PR} did not complete in time"
          exit 1
