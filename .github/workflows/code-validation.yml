name: Code Validation

on:
  push:
    branches: [master]
  pull_request:

# Supersede stale runs.  A re-push to a PR cancels that PR's in-flight
# run; on master the running run keeps its verdict (cancel-in-progress
# is false for pushes) and a burst of stacked merges collapses pending
# intermediates to the tip, whose verdict is what "is master green"
# gates on.  Defends the account-wide runner pool against the observed
# contention mode where overlapping runs queued an e2e shard for ~7 min.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.filter.outputs.run_checks }}
      sandbox_changed: ${{ steps.filter.outputs.sandbox_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect build-affecting changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PROBASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUHS_BEFORE_SHA"
            head="$PUHS_HEAD_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "sandbox_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          if echo "$changed" | grep -qE '\.py$|^pyproject\.toml|^uv\.lock|^alembic\.ini|^migrations|^dockers|^connectors|^bin/tool|^\.github/workflows|^packages|^Dockerfile|^compose\.yml|^openapi\.json'; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^dockers|^bin/tool'; then
            echo "sandbox_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox_changed=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: detect
    if: needs.detect.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    env:
      AIOS_DB_URL: postgresql://aios:aios@localhost:5432/aios_test
      AIOS_API_KEY: test-key-for-ci
      AIOS_VAULT_KEY: 5Uvx6pICqEEpPDl+1f5SrKyXOoQA5j0XcYD590hZH/Y=
      AIOS_EGRESS_CA_KEY: kBhGwxDFjaYVWHd5Xwa6HlMPwcCNf3cjhMhjd06v50I=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { enable-cache: true }
      - run: uv python install 3.13
      - run: uv sync --dev
      - run: uv run python scripts/pooled_connection_lint.py src
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run mypy src tests

  unit:
    needs: detect
    if: needs.detect.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.13
      - run: uv sync --dev
      - run: uv run pytest tests/unit -q -n 4
