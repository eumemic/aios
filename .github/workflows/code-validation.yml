name: Code Validation

on:
  push:
    branches: [master]
  pull_request:

# Supersede stale runs.  A re-push to a PR cancels that PR's in-flight
# run; on master the running run keeps its verdict (cancel-in-progress
# is false for pushes) and a burst of stacked merges collapses pending
# intermediates to the tip, whose verdict is what "is master green"
# gates on.  Defends the account-wide runner pool against the observed
# contention mode where overlapping runs queued an e2e shard for ~7 min.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries timeout-minutes so a wedged step fails fast with a
# log instead of riding GitHub's 360-min default — the 2026-08-27
# cache-service outage left a unit job running wedged for 3h19m.

jobs:
  # Mirrors the pre-commit hook's short-circuit: docs-only changes skip
  # the heavy validation pipeline.  Widened beyond the hook's `.py$`
  # filter to also catch files that can break the build without
  # touching a `.py` directly (lint config, pinned deps, sandbox image,
  # the workflow itself).
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.filter.outputs.run_checks }}
      sandbox_changed: ${{ steps.filter.outputs.sandbox_changed }}
      browser_changed: ${{ steps.filter.outputs.browser_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need both base and head reachable for the diff below.  Aios
          # is small enough that a full fetch is cheap.
          fetch-depth: 0

      - name: Detect build-affecting changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          # First push to a new branch, force-push from a non-fast-forward,
          # or any case where `before` is the all-zeros SHA: be conservative
          # and run the full pipeline AND rebuild both images (since we
          # cannot tell whether their inputs changed).
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No usable base ref — running checks and rebuilding sandbox + browser images."
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "sandbox_changed=true" >> "$GITHUB_OUTPUT"
            echo "browser_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"
          echo

          # Anything that can affect lint / types / tests / sandbox
          # build / the workflow itself counts as build-affecting.
          # Everything else (READMEs, LICENSE, prose docs) skips.
          # ``bin/tool`` is a sandbox-image input (COPY-d by the Dockerfile)
          # and must invalidate the cheap-skip path alongside the source
          # tree even though it lives outside ``src/``.
          # The root ``Dockerfile``, ``compose.yml``, and ``openapi.json``
          # are included so changes to those files — and to the generated
          # SDK under ``packages/aios-sdk/aios_sdk/_generated/`` — always
          # run CI.  ``tests/unit/test_detect_filter_sync.py`` enforces that
          # this regex stays in sync with all committed generated artifacts.
          # ``aios-browser-driver`` is matched whole: it ships the first
          # runtime-load-bearing non-Python source in ``packages/``
          # (``snapshot/walker.js``), which the ``\.py$`` arm would miss.
          # ``.dockerignore`` shapes the browser image's package COPY, so a
          # PR touching only it must still reach the e2e job (where
          # ``browser_changed`` routes it into a rebuild).
          if echo "$changed" | grep -qE '\.py$|^pyproject\.toml$|^uv\.lock$|^alembic\.ini$|^migrations/|^docker/|^connectors/[^/]+/Dockerfile$|^bin/tool$|^\.github/workflows/|^packages/aios-browser-driver/|^packages/[^/]+/(pyproject\.toml|CHANGELOG\.md)$|^Dockerfile$|^compose\.yml$|^openapi\.json$|^\.dockerignore$'; then
            echo "Build-affecting changes detected — running checks."
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs/config-only changes — skipping checks."
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi

          # Sandbox image inputs: exactly what ``docker/Dockerfile.sandbox``
          # is built from — itself plus the ``bin/tool`` binary it COPYs.
          # When none changed, the ``e2e`` job can pull
          # ``ghcr.io/eumemic/aios-sandbox:smoked`` (published by
          # ``build-sandbox.yml`` after its smoke test passes) instead of
          # rebuilding from scratch — saves ~29 s per run.  Deliberately NOT
          # ``^docker/``: the browser image's inputs and the seccomp profiles
          # live there too, and none of them are sandbox-image inputs (the
          # profiles are read from the checkout at ``docker run`` time, never
          # baked into either image), so a browser-only PR must not force a
          # sandbox rebuild.  ``tests/unit/test_detect_filter_sync.py`` pins
          # both image filters.
          if echo "$changed" | grep -qE '^docker/Dockerfile\.sandbox$|^bin/tool$'; then
            echo "Sandbox inputs changed — rebuilding image."
            echo "sandbox_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sandbox inputs unchanged — will pull pre-built image."
            echo "sandbox_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Browser image inputs: what ``docker/Dockerfile.browser`` is built
          # from — itself, the driver package's SHIPPED files (the package
          # dir enumerated by top-level entry, because ``tests/`` is
          # ``.dockerignore``d out of the build context and must not trigger
          # the ~10 min rebuild), the protocol module COPYed over the
          # package's vendored copy, and ``.dockerignore`` itself (it shapes
          # the package-directory COPY; the sandbox image COPYs only single
          # files, so it is not a sandbox input).  When none changed, the
          # ``e2e`` job pulls ``ghcr.io/eumemic/aios-browser:smoked``
          # (published by ``build-browser-image.yml`` after BOTH browser e2e
          # suites pass) instead of paying the local build.
          if echo "$changed" | grep -qE '^docker/Dockerfile\.browser$|^packages/aios-browser-driver/(aios_browser_driver/|pyproject\.toml$|README\.md$|requirements\.lock$)|^src/aios/sandbox/browser_protocol\.py$|^\.dockerignore$'; then
            echo "Browser-image inputs changed — rebuilding image."
            echo "browser_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Browser-image inputs unchanged — will pull pre-built image."
            echo "browser_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The four check jobs below run in parallel.  Splitting them off the
  # previous monolithic ``validate`` job collapses the critical path from
  # ``sum(lint, mypy, unit, integration, sandbox build, e2e)`` to
  # ``max(...)``.  Each job pays its own checkout + uv-setup overhead
  # (~10-15 s), but they pay in parallel.  The setup-uv cache is shared
  # across jobs by the action.
  lint:
    needs: detect
    if: needs.detect.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # ``get_settings()`` is called at module import by code that ruff/mypy
      # also import (``aios.harness.worker`` → ``procrastinate_app``).  The
      # URL is never reached — these are static analysis steps — but it
      # must parse as a valid Postgres DSN for the import to succeed.
      AIOS_DB_URL: postgresql://aios:aios@localhost:5432/aios_test
      AIOS_API_KEY: test-key-for-ci
      AIOS_VAULT_KEY: 5Uvx6pICqEEpPDl+1f5SrKyXOoQA5j0XcYD590hZH/Y=
      AIOS_EGRESS_CA_KEY: kBhGwxDFjaYVWHd5Xwa6HlMPwcCNf3cjhMhjd06v50I=

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Pooled connection await invariant
        run: uv run python scripts/pooled_connection_lint.py

      - name: Verify pooled-await exception issues are open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ask the LINTER what an exemption marker is -- never re-implement the parse
          # here (aios#2143). An inline grep requiring the ref to follow `allow`
          # IMMEDIATELY silently skipped `allow -- eumemic/aios#919`, so that exemption
          # pointed at a CLOSED issue for two months while this step reported success.
          # Two mechanisms parsing one syntax with different rules is how a blind spot
          # appears; the linter is now the single source of truth.
          uv run python scripts/pooled_connection_lint.py --list-exemptions \
            | sort -u > /tmp/exemptions.tsv

          # FAIL CLOSED ON AN EMPTY ENUMERATION. If the linter crashes, the path is
          # wrong, or every file is unreadable, zero rows come back -- and treating
          # that as "all clear" would make total enumeration failure indistinguishable
          # from a clean result. That is precisely the defect this step exists to fix
          # (aios#2138: a predicate that reads "I could not check" as "it is fine"),
          # so the fix must not reintroduce it one layer up. The repo is known to
          # carry exemptions; zero means the enumerator broke, not that they vanished.
          if [[ ! -s /tmp/exemptions.tsv ]]; then
            echo "::error::pooled-await exemption enumeration returned NOTHING. The repo carries known exemptions, so an empty result means the enumerator failed -- it does NOT mean there are none. Refusing to report all-clear."
            exit 1
          fi

          fail=0
          while IFS=$'\t' read -r site ref; do
            [[ -z "$site$ref" ]] && continue
            # A row we cannot parse is an exemption we cannot check. Never skip it.
            if [[ -z "$ref" || "$site" != *:* ]]; then
              echo "::error::unparseable exemption row from the enumerator: '${site}\t${ref}' -- refusing to skip it, because a skipped row is an unchecked exemption."
              fail=1
              continue
            fi
            issue=${ref##*#}
            state=$(gh api "repos/eumemic/aios/issues/$issue" --jq .state 2>/dev/null || echo missing)
            if [[ "$state" != "open" ]]; then
              # Name the EXEMPTION and its file:line, not just the issue number: the
              # reader's next action is to edit that marker, and a bare issue number
              # makes every occurrence a fresh investigation.
              echo "::error file=${site%%:*},line=${site##*:}::pooled-await exemption at ${site} cites ${ref}, which is ${state} (must be open). Re-anchor it to a live tracking issue, or remove the exemption."
              fail=1
            fi
          done < /tmp/exemptions.tsv
          exit $fail

      - name: Lint (ruff)
        # ``packages/aios-sdk/aios_sdk`` carries hand-written modules
        # (``__init__.py``, ``config.py``, ``factory.py``, ``streaming.py``)
        # alongside the generated ``_generated/`` tree.  Root
        # ``pyproject.toml`` already excludes ``_generated/`` via
        # ``extend-exclude`` and ``mypy.overrides``; including the package
        # here lets ruff and mypy cover the hand-written surface so the
        # release workflow's ``no re-gate'' assumption is honored.
        #
        # The ``connectors/*/src`` trees (signal/slack/sms/telegram/whatsapp)
        # and ``packages/aios-connector-http/aios_connector_http`` (whose
        # package lives at the package root, not under ``src/``) are
        # workspace members whose source had never been linted/typed.  The
        # echo-http connector has no ``src/`` and is omitted.
        run: |
          uv run ruff check src tests packages/aios-sdk/aios_sdk connectors/signal/src connectors/slack/src connectors/sms/src connectors/telegram/src connectors/whatsapp/src packages/aios-connector-http/aios_connector_http packages/aios-browser-driver/aios_browser_driver
          uv run ruff format --check src tests packages/aios-sdk/aios_sdk connectors/signal/src connectors/slack/src connectors/sms/src connectors/telegram/src connectors/whatsapp/src packages/aios-connector-http/aios_connector_http packages/aios-browser-driver/aios_browser_driver

      - name: Type check (mypy)
        run: uv run mypy src tests packages/aios-sdk/aios_sdk connectors/signal/src connectors/slack/src connectors/sms/src connectors/telegram/src connectors/whatsapp/src packages/aios-connector-http/aios_connector_http packages/aios-browser-driver/aios_browser_driver

  unit:
    needs: detect
    if: needs.detect.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AIOS_DB_URL: postgresql://aios:aios@localhost:5432/aios_test
      AIOS_API_KEY: test-key-for-ci
      AIOS_VAULT_KEY: 5Uvx6pICqEEpPDl+1f5SrKyXOoQA5j0XcYD590hZH/Y=
      AIOS_EGRESS_CA_KEY: kBhGwxDFjaYVWHd5Xwa6HlMPwcCNf3cjhMhjd06v50I=

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Unit tests
        # ``-n 4`` matches the 4 vCPUs on public-repo ubuntu-latest
        # runners.  The suite is xdist-safe by construction: no DB, no
        # fixed ports (broker tests bind port 0 / mkdtemp UDS paths),
        # per-worker ``AIOS_INSTANCE_ID`` via tests/conftest.py.
        # Measured locally: 45 s serial → 17 s at ``-n 4``.
        # ``faulthandler_timeout``: a hung test dumps tracebacks instead of
        # sitting silent until timeout-minutes fires (mirrors integration).
        run: uv run pytest tests/unit -q -n 4 -o faulthandler_timeout=120

  connectors:
    needs: detect
    if: needs.detect.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Connector tests
        # Each connector ``tests/`` dir has its own ``__init__.py`` and no
        # parent package, so pytest resolves every connector conftest to the
        # module name ``tests.conftest`` — collecting two in one process is an
        # ``ImportPathMismatchError``.  The connectors are independent uv
        # workspace members (own ``pyproject.toml``, own pytest rootdir/
        # config), so each runs as its own invocation, using its own config.
        # These are pure unit tests (mocked daemons; no Postgres/Docker/
        # network), so no ``services:`` block is needed.  Run under ``bash
        # -e`` (the Actions default), a failing suite aborts the job.
        run: |
          uv run pytest connectors/signal/tests -q
          uv run pytest connectors/slack/tests -q
          uv run pytest connectors/sms/tests -q
          uv run pytest connectors/telegram/tests -q
          uv run pytest connectors/whatsapp/tests -q
          uv run pytest packages/aios-connector-http/tests -q
          uv run pytest packages/aios-sdk/tests -q
          uv run pytest packages/aios-browser-driver/tests -q

      - name: Browser driver isolated-install smoke test
        # The browser image installs this package standalone
        # (``uv pip install --no-sources ./packages/aios-browser-driver``), so
        # the unified workspace env must not mask a dropped runtime dep. Install
        # only its closure into a throwaway venv and import the daemon entry —
        # the same by-path install ``docker/Dockerfile.browser`` will do.
        run: |
          uv venv /tmp/browser-driver-isolated
          uv pip install --python /tmp/browser-driver-isolated/bin/python --no-sources \
            ./packages/aios-browser-driver
          /tmp/browser-driver-isolated/bin/python -c "import aios_browser_driver.daemon"

      - name: Slack connector isolated-install smoke test
        # ``uv sync --dev`` above resolves the *unified workspace* env, where
        # aiohttp/websockets are present transitively (aiodocker/litellm root
        # deps).  That masks a missing dependency in a connector's own
        # closure — exactly the gap that shipped a Docker image which crashed
        # at ``import aios_slack`` with ``ModuleNotFoundError: aiohttp``.  This
        # step installs ONLY the slack closure into a throwaway venv (the same
        # ``--no-sources`` by-path install the Dockerfile does) and imports the
        # connector, so a dropped runtime dep fails CI instead of production.
        run: |
          uv venv /tmp/slack-isolated
          uv pip install --python /tmp/slack-isolated/bin/python --no-sources \
            ./packages/aios-sdk \
            ./packages/aios-connector-http \
            ./connectors/slack
          /tmp/slack-isolated/bin/python -c "import aios_slack.connector"

  integration:
    needs: detect
    if: needs.detect.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    # Generous: covers the flake-retry path re-running the full suite.
    timeout-minutes: 30

    env:
      # Parse-only: ``get_settings()`` must see a valid Postgres DSN at
      # import time.  Nothing dials this URL — the tests run against a
      # per-worker testcontainer Postgres (tests/conftest.py), which is
      # why this job declares no ``services:`` block.
      AIOS_DB_URL: postgresql://aios:aios@localhost:5432/aios_test
      AIOS_API_KEY: test-key-for-ci
      AIOS_VAULT_KEY: 5Uvx6pICqEEpPDl+1f5SrKyXOoQA5j0XcYD590hZH/Y=
      AIOS_EGRESS_CA_KEY: kBhGwxDFjaYVWHd5Xwa6HlMPwcCNf3cjhMhjd06v50I=

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Integration tests
        # ``-n 4`` matches the 4 vCPUs on public-repo ubuntu-latest runners.
        # Each xdist worker owns its own session testcontainer Postgres
        # (tests/conftest.py). The per-test containers that once exhausted
        # hosted-runner Docker under even two workers are gone — migration
        # tests now mint databases on their worker's shared server — so the
        # old serial-only constraint no longer applies. ``--dist=loadfile``
        # keeps module-scoped DB fixtures (test_migrations_0144_search_views)
        # worker-local. Retry only pytest's recorded failures once so a
        # transient testcontainer startup cannot fail the entire suite; a real
        # regression fails both attempts and remains blocking.
        run: |
          if ! uv run pytest tests/integration -q -n 4 --dist=loadfile --durations=25 -o faulthandler_timeout=120; then
            echo "::warning::FLAKE_RETRY integration"
            echo "FLAKE_RETRY integration" >> "$GITHUB_STEP_SUMMARY"
            echo "FLAKE_RETRY integration" >> flake-retry-integration.txt
            uv run pytest tests/integration -q -n 4 --dist=loadfile --durations=25 -o faulthandler_timeout=120 --lf
          fi

      - name: Upload integration flake-retry marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-retry-integration
          path: flake-retry-integration.txt
          if-no-files-found: ignore

  # E2E runs as a two-shard matrix.  Tests carrying ``pytest.mark.docker``
  # (added at module scope on the 31 files that use the sandbox image)
  # run in the ``docker`` shard; everything else in ``non-docker``.  The
  # non-docker shard skips the sandbox-image step entirely (~30 s saved).
  # ``fail-fast: false`` so one shard's failure doesn't abort the other.
  e2e:
    needs: detect
    runs-on: ubuntu-latest
    # Docker shard: covers the image fallbacks — a sandbox rebuild plus,
    # worst case, the ~10 min local browser build when ``:smoked`` is
    # missing or stale.  Non-docker shard keeps the original 30 (its worst
    # case is the full-suite flake retry); a wedge there should still fail
    # fast.
    timeout-minutes: ${{ matrix.shard == 'docker' && 45 || 30 }}

    strategy:
      fail-fast: false
      matrix:
        shard: [non-docker, docker]

    # Required to ``docker pull`` the sandbox/browser images from GHCR when
    # their inputs are unchanged.  Read-only; ``build-sandbox.yml`` and
    # ``build-browser-image.yml`` are the only writers.  Only the docker
    # shard actually uses it, but GHA does not support per-matrix-leg
    # permissions.
    permissions:
      contents: read
      packages: read

    env:
      # Parse-only: ``get_settings()`` must see a valid Postgres DSN at
      # import time.  Nothing dials this URL — the tests run against a
      # per-worker testcontainer Postgres (tests/conftest.py), which is
      # why this job declares no ``services:`` block.
      AIOS_DB_URL: postgresql://aios:aios@localhost:5432/aios_test
      AIOS_API_KEY: test-key-for-ci
      AIOS_VAULT_KEY: 5Uvx6pICqEEpPDl+1f5SrKyXOoQA5j0XcYD590hZH/Y=
      AIOS_EGRESS_CA_KEY: kBhGwxDFjaYVWHd5Xwa6HlMPwcCNf3cjhMhjd06v50I=

    steps:
      # Matrix jobs whose per-shard names are required status contexts must
      # gate their *steps*, not the job, so the matrix always expands and
      # each shard reports a real status even on docs-only PRs — see #683.
      - name: Skip (docs-only PR — no-op shard)
        if: needs.detect.outputs.run_checks != 'true'
        run: |
          echo "run_checks=false: ${{ matrix.shard == 'docker' && 'e2e (docker)' || 'e2e (non-docker)' }} is a no-op; reporting success to satisfy branch protection."

      - uses: actions/checkout@v4
        if: needs.detect.outputs.run_checks == 'true'

      - uses: astral-sh/setup-uv@v4
        if: needs.detect.outputs.run_checks == 'true'
        with:
          enable-cache: true

      - name: Install Python 3.13
        if: needs.detect.outputs.run_checks == 'true'
        run: uv python install 3.13

      - name: Install dependencies
        if: needs.detect.outputs.run_checks == 'true'
        run: uv sync --dev

      - name: Log in to GHCR
        # Needed only for the ``docker pull`` paths below (sandbox and/or
        # browser image).  When both are being rebuilt locally this login is
        # unused but harmless.
        if: needs.detect.outputs.run_checks == 'true' && matrix.shard == 'docker' && (needs.detect.outputs.sandbox_changed == 'false' || needs.detect.outputs.browser_changed == 'false')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull sandbox image from GHCR
        # ``:smoked`` is set by ``build-sandbox.yml``'s smoke job after the
        # contract test passes, so PRs never get an unverified image.
        # Retag under the CI-local ``aios-sandbox:ci`` name the E2E step's
        # ``AIOS_DOCKER_IMAGE`` env points at — see the build step below
        # for why a non-GHCR-prefixed tag matters (the
        # ``test_sandbox_image_contract`` silent-fallback footgun from
        # PR #670).
        #
        # The sanity probes (``image inspect`` + ``which tool``) mirror
        # the build step's probes: the pulled image must satisfy the
        # same contract the built one does, otherwise a stale ``:smoked``
        # (e.g. ``bin/tool`` advanced on master between this PR's base
        # and the last ``build-sandbox.yml`` publish) would silently
        # produce a misroute later in the E2E run.
        #
        # ``continue-on-error`` lets the next step fall back to a local
        # build when this fails — GHCR outage, ``:smoked`` not yet
        # published, fork-PR token cannot read a private package.
        id: pull_sandbox
        if: needs.detect.outputs.run_checks == 'true' && matrix.shard == 'docker' && needs.detect.outputs.sandbox_changed == 'false'
        continue-on-error: true
        run: |
          docker pull ghcr.io/eumemic/aios-sandbox:smoked
          docker tag ghcr.io/eumemic/aios-sandbox:smoked aios-sandbox:ci
          docker image inspect aios-sandbox:ci --format 'image registered: {{.Id}}'
          docker run --rm aios-sandbox:ci which tool || {
            echo "::error::bin/tool not found in pulled image — :smoked tag is stale relative to HEAD"
            exit 1
          }

      - name: Build sandbox image
        # CI-local tag (no registry prefix) — pairs with the
        # ``AIOS_DOCKER_IMAGE`` env on the E2E step. The
        # ``test_sandbox_image_contract`` fixture falls through to
        # ``docker pull`` if a local lookup fails for any reason; with
        # the previous ``ghcr.io/eumemic/aios-sandbox:latest`` tag that
        # silently masked a missed local build by using the stale
        # registry image instead (PR #670 hit exactly that). A
        # non-GHCR tag makes the fallback pull fail loudly.
        #
        # Post-build sanity probes the daemon's image store and the
        # one binary the build added; if either is missing the step
        # fails here rather than letting a silent fallback misroute
        # later. GHA's default shell is ``bash -e {0}`` (NO pipefail —
        # that needs an explicit ``shell: bash``), so avoid pipelines in
        # these steps; the explicit ``|| exit 1`` after the ``docker run``
        # makes the failure mode obvious in the log.
        #
        # Fires when the Dockerfile/bin/tool inputs changed (so the pull
        # path was skipped) OR when the pull path attempted and failed.
        if: needs.detect.outputs.run_checks == 'true' && matrix.shard == 'docker' && ( needs.detect.outputs.sandbox_changed == 'true' || steps.pull_sandbox.outcome == 'failure' )
        run: |
          if [[ "${{ steps.pull_sandbox.outcome }}" == "failure" ]]; then
            echo "::warning::GHCR pull failed; falling back to local sandbox build"
          fi
          docker build -t aios-sandbox:ci -f docker/Dockerfile.sandbox .
          docker image inspect aios-sandbox:ci --format 'image registered: {{.Id}}'
          docker run --rm aios-sandbox:ci which tool || {
            echo "::error::bin/tool not found in built image — build step did not produce expected artifacts"
            exit 1
          }

      - name: Pull browser image from GHCR
        # Same shape and rationale as the sandbox pull above; ``:smoked`` is
        # published by ``build-browser-image.yml`` only after BOTH browser
        # e2e suites pass against the freshly built sha tag.
        #
        # The stale-probe mirrors the sandbox lane's ``which tool``: the
        # image's installed ``browser_protocol.py`` must be byte-identical to
        # the checkout's.  The contract e2e asserts the same equality later,
        # but only THIS step's failure routes into the local-build fallback —
        # probing here turns a stale ``:smoked`` (protocol advanced on master
        # between this PR's base and the last publish) into a self-healing
        # rebuild instead of a red shard.
        id: pull_browser
        if: needs.detect.outputs.run_checks == 'true' && matrix.shard == 'docker' && needs.detect.outputs.browser_changed == 'false'
        continue-on-error: true
        run: |
          docker pull ghcr.io/eumemic/aios-browser:smoked
          docker tag ghcr.io/eumemic/aios-browser:smoked aios-browser:ci
          docker image inspect aios-browser:ci --format 'image registered: {{.Id}}'
          docker run --rm aios-browser:ci python3 -c \
            "import aios_browser_driver.browser_protocol as m, sys; sys.stdout.buffer.write(open(m.__file__, 'rb').read())" \
            > /tmp/installed-protocol.py
          cmp /tmp/installed-protocol.py src/aios/sandbox/browser_protocol.py || {
            echo "::error::installed browser_protocol.py differs from checkout — :smoked is stale relative to HEAD"
            exit 1
          }

      - name: Build browser image
        # Fires when the image inputs changed (the pull path was skipped) OR
        # the pull attempted and failed — GHCR outage, ``:smoked`` not yet
        # published (e.g. the first run after the browser lane merges, before
        # ``build-browser-image.yml``'s first master publish), or the
        # stale-probe above tripped.  amd64-only and QEMU-free, unlike the
        # publishing workflow — roughly a 10-minute cold build (apt
        # install-deps + Chromium download dominate).
        #
        # Deliberately no post-build protocol probe (the sandbox lane re-runs
        # ``which tool`` here): a from-checkout build is protocol-identical
        # by construction, and the contract e2e re-asserts byte equality in
        # this same shard.
        if: needs.detect.outputs.run_checks == 'true' && matrix.shard == 'docker' && ( needs.detect.outputs.browser_changed == 'true' || steps.pull_browser.outcome == 'failure' )
        run: |
          if [[ "${{ steps.pull_browser.outcome }}" == "failure" ]]; then
            echo "::warning::GHCR pull failed; falling back to local browser build"
          fi
          docker build -t aios-browser:ci -f docker/Dockerfile.browser .
          docker image inspect aios-browser:ci --format 'image registered: {{.Id}}'

      - name: E2E tests (non-docker shard)
        # These tests are "non-docker" only in the sandbox-image sense: most
        # still provision a Postgres testcontainer. Run serially so each stack
        # is torn down before the next starts. If runner/container startup is
        # transiently unhealthy, retry the complete serial shard: ``--lf``
        # cannot reconstruct a failure during session fixture setup. A stable
        # regression remains blocking because it fails both attempts.
        if: needs.detect.outputs.run_checks == 'true' && matrix.shard == 'non-docker'
        run: |
          if ! uv run pytest tests/e2e -q -m "not docker" -n 0 --durations=25; then
            echo "::warning::FLAKE_RETRY e2e-non-docker"
            echo "FLAKE_RETRY e2e-non-docker" >> "$GITHUB_STEP_SUMMARY"
            uv run pytest tests/e2e -q -m "not docker" -n 0 --durations=25
          fi

      - name: E2E tests (docker shard)
        # ``-n 2 --dist=loadfile`` bounds Docker-backed concurrency to two
        # workers. Four workers each owned a testcontainers Postgres while
        # concurrently creating sandboxes, proxies, and iptables sidecars on
        # the same 4-vCPU hosted runner; the resulting daemon/network pressure
        # produced unrelated pass-on-rerun failures (#1967), including an
        # in-container curl timing out before reaching its recorder. Two
        # workers retain file-level parallelism without oversubscribing Docker.
        # ``loadfile`` is load-bearing: ``test_memory_cross_session_sync.py``
        # uses a module-scoped ``shared_docker_harness`` fixture which would be
        # torn down + rebuilt per test under the default ``load`` dist.
        if: needs.detect.outputs.run_checks == 'true' && matrix.shard == 'docker'
        env:
          AIOS_DOCKER_IMAGE: aios-sandbox:ci
          # Points the three browser suites (image contract, driver behavior,
          # and the isolation gate's real-provisioning-path probes) at the
          # CI-local image pulled/built above; those suites self-skip when
          # this is unset.
          AIOS_SANDBOX_BROWSER_IMAGE: aios-browser:ci
        # ``-m "docker and not perf"``: the ``perf`` mark is the ADVISORY
        # wall-clock scaling backstop (#1661) — it is deliberately EXCLUDED
        # from this gating run because shared-runner jitter can exceed its
        # ratio threshold even for O(1) reads. The deterministic complexity
        # gates (plan-shape, rows-returned, registry-completeness) carry only
        # ``docker`` and run here as required checks, red like a correctness
        # bug. The advisory ``perf`` tests run in the separate non-blocking
        # step below (same job, never a required check).
        # Fail directly: retrying all recorded failures made a genuinely red
        # required check indistinguishable from runner contention.
        run: |
          uv run pytest tests/e2e -q -m "docker and not perf" -n 2 --dist=loadfile --durations=25

      - name: E2E perf backstop (docker shard, ADVISORY — non-blocking)
        # The ``perf``-marked scaling backstops (#1661): loud advisory signal,
        # NEVER a required check. ``continue-on-error: true`` keeps a jitter-
        # induced ratio breach from failing the required docker shard while
        # still surfacing the result in the job log. Do NOT promote this step
        # to a required status context.
        if: needs.detect.outputs.run_checks == 'true' && matrix.shard == 'docker'
        continue-on-error: true
        env:
          AIOS_DOCKER_IMAGE: aios-sandbox:ci
          AIOS_SANDBOX_BROWSER_IMAGE: aios-browser:ci
        run: |
          uv run pytest tests/e2e -q -m "docker and perf" -n 4 --dist=loadfile
