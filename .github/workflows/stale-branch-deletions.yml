name: Stale Branch Deletions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A base-only change can turn an unchanged PR into a stale deletion. Recheck
  # every open PR and publish a new check against its head in that case.
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: stale-branch-deletions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare the current base and PR head trees
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The PR-files API compares from the merge base and therefore omits
          # files added to the base after a stale head diverged. Always compare
          # the two current trees, on every kind of PR evaluation.
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$HEAD_SHA"
          git ls-tree -r --name-only "$BASE_SHA" > "$RUNNER_TEMP/base-paths.txt"
          python scripts/pr_files_from_trees.py "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/pr-files.json"
          python scripts/check_pr_deletions.py \
            "$RUNNER_TEMP/pr-files.json" "$RUNNER_TEMP/base-paths.txt"

  recheck-open-prs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-evaluate open PR heads against the new base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.ref_name }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-tree -r --name-only "$BASE_SHA" > "$RUNNER_TEMP/base-paths.txt"
          gh api --paginate --slurp \
            "repos/${GH_REPO}/pulls?state=open&base=${BASE_REF}&per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/open-prs.json"

          recheck_pr() {
            local pr="$1" number head_sha title body fetched_head
            local output conclusion payload files="$RUNNER_TEMP/pr-files.json"
            number=$(jq -r '.number' <<<"$pr") || return 1
            head_sha=$(jq -r '.head.sha' <<<"$pr") || return 1
            title=$(jq -r '.title' <<<"$pr") || return 1
            body=$(jq -r '.body // ""' <<<"$pr") || return 1
            files="$RUNNER_TEMP/pr-${number}-files.json"

            # GitHub's PR-files endpoint is merge-base-relative, so it omits a
            # file added only to the base after this PR diverged. Compare the
            # current trees here: that base-only file is precisely the stale
            # deletion this push-triggered pass must catch.
            git fetch --no-tags origin "pull/${number}/head" || return 1
            fetched_head=$(git rev-parse FETCH_HEAD) || return 1
            if [ "$fetched_head" != "$head_sha" ]; then
              echo "PR ${number} moved while rechecking; skipping obsolete head ${head_sha}"
              return 0
            fi

            # A push workflow's native check belongs to the base commit. Publish
            # this result as `detect` on the unchanged PR head: unlike this
            # workflow's advisory `check` job, `detect` is required by master
            # branch protection. A base-only stale deletion therefore replaces
            # the older green required result with a blocking failure.
            #
            # Evaluate first and create the check already completed. This avoids
            # ever stranding an in-progress check if a later command/API fails.
            if ! output=$(python scripts/pr_files_from_trees.py "$BASE_SHA" "$head_sha" \
              2>&1 > "$files"); then
              conclusion=failure
              output="Could not compare current trees: ${output}"
            elif output=$(PR_TITLE="$title" PR_BODY="$body" \
              python scripts/check_pr_deletions.py "$files" \
                "$RUNNER_TEMP/base-paths.txt" 2>&1); then
              conclusion=success
            else
              conclusion=failure
            fi

            payload=$(jq -n --arg head_sha "$head_sha" \
              --arg conclusion "$conclusion" --arg output "$output" '{
              name: "detect",
              head_sha: $head_sha,
              status: "completed",
              conclusion: $conclusion,
              output: {title: "Stale branch deletion guard", summary: $output}
            }') || return 1
            gh api --method POST "repos/${GH_REPO}/check-runs" \
              --input - <<<"$payload" >/dev/null || return 1
          }

          # Handle each PR as an independent unit. In particular, errexit must
          # not let one fetch/API/comparison failure preserve stale results on
          # all later PRs.
          while read -r pr; do
            if ! recheck_pr "$pr"; then
              number=$(jq -r '.number // "unknown"' <<<"$pr" 2>/dev/null || echo unknown)
              echo "::error::Could not recheck PR ${number}; continuing with remaining PRs"
            fi
          done < <(jq -c '.[]' "$RUNNER_TEMP/open-prs.json")
