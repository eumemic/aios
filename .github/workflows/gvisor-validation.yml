name: gVisor Validation

# HOSTED BY NECESSITY (not an off-substrate dead-man): this job installs runsc from
# the gVisor apt repo, edits /etc/docker/daemon.json, restarts the Docker daemon, and
# runs parallel container E2E. On the shared [self-hosted, watchdog] box that would
# mutate global host state every other watchdog depends on. Assessed 2026-08-13 under
# the eumemic-ops#414 GHA exit and deliberately LEFT on ubuntu-latest, where a clean
# ephemeral VM per run is exactly what it needs.

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: '37 9 * * 2'

# WHY PUSH (2026-09-16). This job proved itself on master only WEEKLY, so a gVisor
# regression lived until the next Tuesday. On 2026-09-16 #2432 took the suite from
# 1 failing test to 11 and nothing announced it: the weekly cadence meant master's
# own runs were stale, and the only reason it surfaced at all was a human diffing
# failing test NAMES between two hand-dispatched runs. A check that validates master
# once a week is not validating master. Running on every push to master closes the
# window from ~7 days to ~7 minutes.
#
# The concurrency group is REQUIRED alongside it, not decoration: three runs at the
# same SHA raced on 2026-09-16 and two were auto-cancelled, and a `cancelled` run
# renders in the commit's check-runs list as a non-success — indistinguishable from
# a real failure at a glance. Serialising per-ref keeps one authoritative verdict
# per commit. cancel-in-progress is deliberately FALSE: this job mutates global
# Docker daemon state (runsc runtime registration) and a half-killed run can leave
# the daemon reconfigured; let the in-flight one finish and queue the next.
concurrency:
  group: gvisor-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gvisor-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Parse-only: ``get_settings()`` must see a valid Postgres DSN at
      # import time.  Nothing dials this URL — the tests run against a
      # per-worker testcontainer Postgres (tests/conftest.py), which is
      # why this job declares no ``services:`` block.
      AIOS_DB_URL: postgresql://aios:aios@localhost:5432/aios_test
      AIOS_API_KEY: test-key-for-ci
      AIOS_VAULT_KEY: 5Uvx6pICqEEpPDl+1f5SrKyXOoQA5j0XcYD590hZH/Y=

    steps:
      - name: Install runsc
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          arch="$(dpkg --print-architecture)"
          echo "deb [arch=${arch} signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc

      - name: Register runsc Docker runtime
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          daemon_json = Path("/etc/docker/daemon.json")
          if daemon_json.exists():
              config = json.loads(daemon_json.read_text())
          else:
              config = {}
          config.setdefault("runtimes", {})["runsc"] = {
              "path": "/usr/bin/runsc",
              # --oci-seccomp: runsc defaults this OFF, so Docker's authored
              # seccomp profile (CLONE_NEWUSER deny) never reaches the Sentry.
              # --overlay2=none: gVisor's default rootfs self-overlay hides
              # tenant writes from Docker SizeRw/diff/commit identity.
              "runtimeArgs": ["--oci-seccomp", "--overlay2=none"],
          }
          # Image mounts provide the read-only operator tool root used to
          # program netfilter inside the target runsc Sentry.
          config.setdefault("features", {})["containerd-snapshotter"] = True
          daemon_json.write_text(json.dumps(config, separators=(",", ":")))
          # Expected runtime stanza: {"runtimes":{"runsc":{"path":"/usr/bin/runsc","runtimeArgs":["--oci-seccomp","--overlay2=none"]}}}
          PY
          sudo systemctl restart docker
          docker run --runtime=runsc --rm alpine echo ok
          # The runsc egress path installs netfilter from inside the target
          # Sentry using binaries from a read-only image mount, so prove the
          # daemon actually honours --mount type=image here.  Without this the
          # capability is only asserted by the daemon.json edit above, and a
          # runner whose Engine ignores it would fail every Limited
          # provisioning deep inside the suite with an unrelated-looking error.
          docker run --rm --mount "type=image,src=alpine,dst=/mnt/operator-root" \
            alpine test -x /mnt/operator-root/bin/busybox || {
            echo "::error::daemon does not support --mount type=image (needs Engine 28+ with the containerd image store); the runsc egress path cannot work"
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Build sandbox image
        # CI-local tag (no registry prefix) — pairs with the
        # ``AIOS_DOCKER_IMAGE`` env on the E2E step. The
        # ``test_sandbox_image_contract`` fixture falls through to
        # ``docker pull`` if a local lookup fails for any reason; with
        # the previous ``ghcr.io/eumemic/aios-sandbox:latest`` tag that
        # silently masked a missed local build by using the stale
        # registry image instead (PR #670 hit exactly that). A
        # non-GHCR tag makes the fallback pull fail loudly.
        #
        # Post-build sanity probes the daemon's image store and the
        # one binary the build added; if either is missing the step
        # fails here rather than letting a silent fallback misroute
        # later. ``set -euo pipefail`` is the workflow default but
        # the explicit ``|| exit 1`` after the ``docker run`` makes
        # the failure mode obvious in the log.
        run: |
          docker build -t aios-sandbox:ci -f docker/Dockerfile.sandbox .
          docker image inspect aios-sandbox:ci --format 'image registered: {{.Id}}'
          docker run --rm aios-sandbox:ci which tool || {
            echo "::error::bin/tool not found in built image — build step did not produce expected artifacts"
            exit 1
          }

      - name: E2E tests (docker shard under runsc)
        # ``-n 4 --dist=loadfile`` runs the docker shard in four parallel
        # xdist workers, one whole-file at a time.  ``loadfile`` is load-
        # bearing: ``test_memory_cross_session_sync.py`` uses a module-
        # scoped ``shared_docker_harness`` fixture which would be torn
        # down + rebuilt per test under the default ``load`` dist.  Four
        # workers matches public-repo ubuntu-latest runners (4 vCPU /
        # 16 GB since 2024 — the old ``-n 2`` here predates that spec).
        # Each worker amortizes its own testcontainer-Postgres + Docker
        # setup over ~55 tests.
        #
        # ``-m 'docker and not netns_sidecar_egress and not runsc_dns_unresolved and not perf'``: the ``perf`` mark is the ADVISORY
        # wall-clock scaling backstop (#1661), excluded here for the same
        # reason it is excluded from the gating run in ``code-validation.yml``
        # — shared-runner jitter can exceed its ratio threshold on work that
        # is genuinely O(1), and gVisor's syscall interception widens that
        # jitter further.  This narrows the selection by MARK only: every
        # ``docker``-marked test still runs and still fails the job, so a real
        # runsc regression stays red.
        env:
          AIOS_DOCKER_IMAGE: aios-sandbox:ci
        #
        # WHY THE DESELECTS (2026-09-15). This job had failed all 17 runs since its
        # first on 2026-06-12 -- it had never once been green, which makes it
        # indistinguishable from no check at all while occupying the slot where a
        # working check would go.
        #
        # The failures were not flaky infra and not a product regression. They are
        # STRUCTURAL:
        #
        #   * `netns_sidecar_egress` -- the egress lockdown is applied by a sidecar
        #     that joins the sandbox's netns and runs iptables. Under runsc two
        #     containers sharing a netns get SEPARATE Sentries/netstacks, so the
        #     sidecar is addressing a different netstack than the sandbox. The
        #     giveaway is WHICH table fails: the log shows "can't initialize
        #     iptables table `filter'" 8 times against `nat' only twice. If this
        #     were merely gVisor's missing nat table (gvisor#170), filter would
        #     still initialize. iptables exits 3 and the sandbox then REFUSES to
        #     provision -- fail-closed, correct behaviour under test. No amount of
        #     re-running makes these pass with the current in-netns mechanism; a
        #     runtime-agnostic one (host-level DOCKER-USER rules) is aios#2310.
        #
        #   * `runsc_dns_unresolved` -- ONE test (test_unrestricted_allows_all) fails
        #     for a completely different reason: curl exit 6, could-not-resolve-host,
        #     in an Unrestricted sandbox that never invokes the sidecar at all. That
        #     is an unexplained gVisor DNS defect, filed as aios#2430. It is
        #     deselected under its own honest marker rather than mislabelled as a
        #     sidecar failure -- attributing it to the netstack story would have
        #     silenced a real signal.
        #
        #   * `perf` -- ADVISORY wall-clock backstops, declared NON-GATING by their own
        #     failure message and by pyproject (#1661). A shared runner's jitter is not
        #     a gVisor signal.
        #
        # What remains is the real question this job exists to answer: does aios work
        # under gVisor? ~366 e2e tests already answered yes on every one of those red
        # runs -- that signal was simply buried under a guaranteed failure.
        #
        # DO NOT widen these deselects to silence a NEW failure. A test that starts
        # failing here is a genuine gVisor regression and must be fixed, not skipped.
        # When aios#2310 lands a runtime-agnostic egress mechanism, delete the
        # netns_sidecar_egress deselect so the lockdown is validated under runsc again.
        run: |
          AIOS_SANDBOX_RUNTIME=runsc uv run pytest tests/e2e -q -m 'docker and not netns_sidecar_egress and not runsc_dns_unresolved and not perf' -n 4 --dist=loadfile --junitxml=e2e-results.xml

      - name: Summarize failed risk group
        if: failure()
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          junit_path = Path("e2e-results.xml")

          def group_for(test_id: str) -> str:
              lowered = test_id.lower()
              if any(token in lowered for token in ("network", "egress", "lockdown", "limited")):
                  return "networking"
              if any(token in lowered for token in ("snapshot", "commit")):
                  return "snapshot"
              return "other"

          grouped: dict[str, list[str]] = defaultdict(list)
          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              for case in root.iter("testcase"):
                  failures = list(case.findall("failure")) + list(case.findall("error"))
                  if not failures:
                      continue
                  test_id = "::".join(
                      part
                      for part in (
                          case.attrib.get("file") or case.attrib.get("classname", "").replace(".", "/"),
                          case.attrib.get("name", "<unknown>"),
                      )
                      if part
                  )
                  grouped[group_for(test_id)].append(test_id)

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## gVisor validation failures by risk\n\n")
              if not junit_path.exists():
                  summary.write("JUnit report `e2e-results.xml` was not produced; inspect the pytest log.\n")
              # Emits headings: ### networking, ### snapshot, ### other.
              for group in ("networking", "snapshot", "other"):
                  summary.write(f"### {group}\n")
                  tests = grouped.get(group, [])
                  if tests:
                      for test in tests:
                          summary.write(f"- `{test}`\n")
                  else:
                      summary.write("- none\n")
                  summary.write("\n")
          PY
