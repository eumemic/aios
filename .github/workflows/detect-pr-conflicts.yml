name: Detect pull request conflicts

on:
  push:
    branches: [master]

# A single master landing can strand many branches. Serialize notices by commit;
# each run evaluates every currently-open PR against the new base tip.
concurrency:
  group: detect-pr-conflicts
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Classify and notify conflicted pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/detect_pr_conflicts.py
